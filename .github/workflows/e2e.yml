name: E2E

# MANUAL ONLY, on purpose. Read before wiring this to `pull_request`:
#
#   1. The suite runs against the LIVE Neon database. `registration-prefill.spec.ts`
#      seeds and deletes a real `pending_payment` row, and the paid-state suites
#      seed and clean their own rows. There is no separate test database.
#   2. Clerk's development instance throttles sign-ins. CLAUDE.md records that
#      running the full suite repeatedly inside ~10 minutes trips both that
#      throttle and the upload rate-limit bucket, since they key to one identity.
#      Two concurrent runs would fail each other for reasons unrelated to the code.
#
# So this is a button you press, not a gate. The `checks` workflow is the gate.
# If you ever want this automatic, give it its own Neon branch and its own Clerk
# instance first.
on:
  workflow_dispatch:
    inputs:
      grep:
        description: "Only run specs matching this pattern (optional)"
        required: false
        type: string

# One at a time, and never cancel a run midway — a cancelled spec can leave a
# seeded row behind, and a leaked PAID row is reaped by no cron.
concurrency:
  group: e2e-live-database
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright (live database)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      CI: "1"
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fail early and legibly rather than 20 minutes into a timing-out suite.
      - name: Verify required secrets are present
        run: |
          missing=""
          for var in DATABASE_URL CLERK_SECRET_KEY NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY; do
            [ -z "${!var}" ] && missing="$missing $var"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing required secret(s):$missing"
            echo "Add them under Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "All required secrets present."

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # The masthead needs SwiftShader in headless, per CLAUDE.md.
      - name: Run Playwright
        run: npx playwright test ${{ inputs.grep && format('--grep "{0}"', inputs.grep) || '' }}

      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
